name: Research Workflow Agent Java Regression

on:
  push:
    paths:
      - "research-workflow-agent-java/**"
      - ".github/workflows/research-workflow-agent-java-regression.yml"
  pull_request:
    paths:
      - "research-workflow-agent-java/**"
      - ".github/workflows/research-workflow-agent-java-regression.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-workflow-agent-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit and workflow tests
        run: mvn --batch-mode test
